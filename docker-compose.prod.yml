# The production stack: one application container and one database, per
# decision 32, and a migrate container that runs the deploy steps on every
# `up` and exits. This is the file a housing cooperative runs.
#
#   cp .env.production.example .env.production
#   # fill in the five secrets it asks for
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# The project name is set here so a production stack can never share containers
# or volumes with the development database in docker-compose.yml, which lives
# in the same checkout and uses the service name "db" as well.
name: openbrf-prod

# The one image both of the instance's own services run: the migrate service
# with `migrate`, the application with its default command.
x-openbrf-image: &openbrf-image
  # Built locally: there is no published image yet. When one is published this
  # becomes `image: ghcr.io/openbrf/openbrf:<version>` and the build section
  # goes away.
  build:
    context: .
  image: openbrf:local

# Neither of the instance's own containers needs a capability, a privilege it
# could gain through a setuid binary, or a root filesystem it can write: the
# code is the image's, and /data is the only place either writes. /tmp is a
# tmpfs for the npm cache the plugin install job uses and for scratch files.
x-openbrf-hardening: &openbrf-hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    # Pinned by digest, like the database in CI: a mutable tag lets the image
    # change underneath an association's data.
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      # The database's superuser. Its password stays in this container: the
      # instance's own services connect as openbrf_owner and openbrf_app,
      # neither of which is a superuser.
      POSTGRES_USER: openbrf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: openbrf
      # Read by docker/db/initdb/10-schema-owner.sql, which creates
      # openbrf_owner - the role that owns the schema and runs migrations - on
      # the first start of an empty volume. An instance installed before that
      # file existed runs it once by hand (docs/deployment.md).
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:?set OWNER_DB_PASSWORD in the env file}
    # The image starts as root to prepare its data directory and then drops to
    # the postgres user, so its capabilities stay; what it can be stopped from
    # doing is gaining any back.
    security_opt:
      - no-new-privileges:true
    # No published port. The application reaches the database over the compose
    # network; nothing outside the host has any business connecting to it.
    volumes:
      # PostgreSQL 18 moved PGDATA to a version-scoped path
      # (/var/lib/postgresql/18/docker) and raised its declared VOLUME to
      # /var/lib/postgresql. Mounting the pre-18 /var/lib/postgresql/data here
      # leaves the real data directory outside this named volume, and the
      # entrypoint then classifies the stale mount as unused legacy data and
      # exits before initialising.
      - postgres-data:/var/lib/postgresql
      - ./docker/db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbrf -d openbrf"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The deploy steps: the field encryption key on a first boot, migrations, the
  # job queue schema and the application's own database role, all as the schema
  # owner. Runs on every `up`, does its work and exits; the application starts
  # only once it has succeeded. This is the only container that is given the
  # owner's password.
  migrate:
    <<: [*openbrf-image, *openbrf-hardening]
    command: ["migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production

      # The parts rather than the connection URLs: a password is a URL
      # component, one holding :, /, @, ? or # has to be percent-encoded, and
      # interpolation here cannot encode anything. The entrypoint assembles the
      # URLs from these, encoding as it goes.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: openbrf
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:?set OWNER_DB_PASSWORD in the env file}

      # The application's own role, which this service creates from the password
      # and constrains - or, with DATABASE_URL_RUNTIME set instead, leaves to the
      # operator who manages it. See the app service below.
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:-}
      DATABASE_URL_RUNTIME: ${DATABASE_URL_RUNTIME:-}

      # Read to tell a first boot from a missing key; see the app service.
      OPENBRF_ENCRYPTION_KEY: ${OPENBRF_ENCRYPTION_KEY:-}
    volumes:
      # The field encryption key is generated here on a first boot.
      - instance-data:/data

  app:
    <<: [*openbrf-image, *openbrf-hardening]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000

      # The address members will type. Invitation and sign-in links are built
      # from it, and the session cookie is issued for it, so a wrong value here
      # produces links that go nowhere.
      APP_URL: ${APP_URL:?set APP_URL to the address this instance is reached at}

      # The application connects as openbrf_app, never as the schema owner: a
      # table owner can disable the triggers that keep the member register and
      # the audit log append-only. No owner credential is given to this
      # container, and its entrypoint refuses to start if one is.
      #
      # The parts rather than the connection URL, for the reason given on the
      # migrate service.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: openbrf

      # Two ways to give the application its own connection, and exactly one of
      # them has to arrive. Neither is required here, because requiring either
      # would make the other impossible to use: an operator supplying the URL
      # would still be made to invent a password that is never used, and one
      # supplying the password cannot be made to write a URL. The entrypoint is
      # what refuses a production start that has neither, and its message names
      # both, so the check stays in the one place that can see which arrived.
      #
      # RUNTIME_DB_PASSWORD is the ordinary path: the migrate service creates
      # openbrf_app from it and reapplies its constraints on every deploy.
      # DATABASE_URL_RUNTIME is for an operator who manages that role
      # themselves; the role is left alone and the URL used as written, so its
      # password has to be percent-encoded already. Either way the application
      # asks the database at start whether the role it connected as is a
      # constrained one, and refuses to serve if it is not.
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:-}
      DATABASE_URL_RUNTIME: ${DATABASE_URL_RUNTIME:-}

      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in the env file}

      # The digest of a setup link minted for this instance, set by a host that
      # hands the link to the board. Left empty, an unclaimed instance prints a
      # setup link of its own to this container's log when it starts, and only
      # that link can create the first administrator (ADR 0023).
      OPENBRF_SETUP_TOKEN_DIGEST: ${OPENBRF_SETUP_TOKEN_DIGEST:-}

      # Left unset on purpose: the migrate service generates a key into
      # /data/keys on first boot and refuses to invent one afterwards. Set it
      # only when a hosting platform injects the key instead of mounting a
      # volume, and then keep the env file with the key's copies, out of the
      # backups (docs/backup-and-restore.md).
      OPENBRF_ENCRYPTION_KEY: ${OPENBRF_ENCRYPTION_KEY:-}

      OPENBRF_PLUGINS_ENABLED: ${OPENBRF_PLUGINS_ENABLED:-true}
      OPENBRF_CATALOG_URL: ${OPENBRF_CATALOG_URL:-}
      # Only for an index that requires a bearer token; the curated catalog is
      # public.
      OPENBRF_CATALOG_TOKEN: ${OPENBRF_CATALOG_TOKEN:-}
      OPENBRF_UNCURATED_PLUGINS_ENABLED: ${OPENBRF_UNCURATED_PLUGINS_ENABLED:-false}

      # Mail set where the instance runs (ADR 0024; docs/deployment.md, "Mail").
      # All empty by default, which leaves the mail to the SMTP server the board
      # enters in the setup wizard and the settings. OPENBRF_MAIL_DRIVER "smtp"
      # or "http-api" sets it here instead, for every message, and the settings
      # then show it and cannot change it.
      OPENBRF_MAIL_DRIVER: ${OPENBRF_MAIL_DRIVER:-}
      OPENBRF_MAIL_FROM_ADDRESS: ${OPENBRF_MAIL_FROM_ADDRESS:-}
      OPENBRF_MAIL_FROM_NAME: ${OPENBRF_MAIL_FROM_NAME:-}
      OPENBRF_MAIL_REPLY_TO: ${OPENBRF_MAIL_REPLY_TO:-}
      OPENBRF_SMTP_HOST: ${OPENBRF_SMTP_HOST:-}
      OPENBRF_SMTP_PORT: ${OPENBRF_SMTP_PORT:-}
      OPENBRF_SMTP_SECURE: ${OPENBRF_SMTP_SECURE:-}
      OPENBRF_SMTP_REQUIRE_TLS: ${OPENBRF_SMTP_REQUIRE_TLS:-}
      OPENBRF_SMTP_USER: ${OPENBRF_SMTP_USER:-}
      OPENBRF_SMTP_PASSWORD: ${OPENBRF_SMTP_PASSWORD:-}
      OPENBRF_MAIL_API_URL: ${OPENBRF_MAIL_API_URL:-}
      OPENBRF_MAIL_API_KEY: ${OPENBRF_MAIL_API_KEY:-}
      OPENBRF_MAIL_API_MESSAGE_ID_DOMAIN: ${OPENBRF_MAIL_API_MESSAGE_ID_DOMAIN:-}
    ports:
      # Bound to the loopback interface: put a TLS terminating reverse proxy in
      # front rather than exposing the application directly. Sessions are
      # cookies, and passkeys need a secure origin.
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      # Uploads, the field encryption key, installed plugins and installed
      # themes. Back this up together with the database, without keys/: the key
      # is copied out once and kept apart from every backup, because a backup
      # that carried it would open every encrypted field and stored file in it
      # (docs/backup-and-restore.md).
      - instance-data:/data
    healthcheck:
      # No curl in the image, so the check runs in the runtime that is already
      # there.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      # Migrations and the role hardening have already run, in the migrate
      # service, by the time this container starts.
      start_period: 90s
    # The job queue drains on SIGTERM rather than losing in-flight work.
    stop_grace_period: 30s

volumes:
  # Named distinctly from the development volume in docker-compose.yml so the
  # two stacks can never share a data directory.
  postgres-data:
  instance-data:
