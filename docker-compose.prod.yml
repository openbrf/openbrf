# The production stack: one application container and one database, per
# decision 32, and three containers that run the deploy steps on every `up` and
# exit. This is the file a housing cooperative runs.
#
#   cp .env.production.example .env.production
#   # fill in the one secret it asks for, the address and the release line
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# No database password is asked for. The deploy steps generate each one onto a
# volume that only the services using it mount, so this file also runs on a
# platform that gives every service every variable, Coolify among them
# (docs/deployment.md, "The database passwords"). The application publishes no
# port on the host: a reverse proxy on the stack's network reaches it as
# app:3000, and one on the host adds docker-compose.host-port.yml
# (docs/deployment.md, "Behind a reverse proxy").
#
# The project name is set here so a production stack can never share containers
# or volumes with the development database in docker-compose.yml, which lives
# in the same checkout and uses the service name "db" as well.
name: openbrf-prod

# The one image the instance's own three services run: schema-owner and migrate
# with those commands, the application with its default one. The published
# image, at the release line or the exact version OPENBRF_VERSION names: `0.2`
# follows that line's patch releases on every `pull`, `0.2.0` stays where it is
# (docs/deployment.md, "Versions and upgrades"). It is the release this file
# came from: the deploy services run scripts the image carries.
x-openbrf-image: &openbrf-image
  image: ghcr.io/openbrf/openbrf:${OPENBRF_VERSION:?set OPENBRF_VERSION to the release line to run, for example 0.2}

# None of the instance's own containers needs a capability, a privilege it
# could gain through a setuid binary, or a root filesystem it can write: the
# code is the image's, and /data is the only place any of them writes. /tmp is
# a tmpfs for the npm cache the plugin install job uses and for scratch files.
x-openbrf-hardening: &openbrf-hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# The two deploy steps run once and exit, so the image's health check, which
# asks a server they never start, has nothing to say about them.
x-openbrf-one-shot: &openbrf-one-shot
  restart: "no"
  healthcheck:
    disable: true

services:
  # The database superuser's password, in place before the database starts:
  # POSTGRES_PASSWORD when the env file sets it, as every instance before this
  # service did, and otherwise one generated on a first boot - the database's
  # volume still empty - and on no other, because the database image reads it
  # once, when it initialises that volume (docker/credentials.mjs). Kept on a
  # volume of its own, which this service, the database and schema-owner mount
  # and nothing else does.
  superuser-password:
    <<: [*openbrf-image, *openbrf-hardening, *openbrf-one-shot]
    command: ["superuser-password"]
    environment:
      NODE_ENV: production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - superuser-credentials:/credentials/superuser
      # Read, never written: whether the database's volume holds a database
      # yet is how a first boot is told from a later one.
      - postgres-data:/postgres-data:ro

  db:
    # Pinned by digest, like the database in CI: a mutable tag lets the image
    # change underneath an association's data.
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    depends_on:
      superuser-password:
        condition: service_completed_successfully
    environment:
      # The database's superuser. Its password is read from the file the
      # superuser-password service put in place, and goes to this container
      # and to the schema-owner service, which runs one script and exits: the
      # instance's other services connect as the schema owner and the runtime
      # role, neither of which is a superuser.
      POSTGRES_USER: openbrf
      POSTGRES_PASSWORD_FILE: /credentials/superuser/password
      POSTGRES_DB: openbrf
    # The image starts as root to prepare its data directory and then drops to
    # the postgres user, so its capabilities stay; what it can be stopped from
    # doing is gaining any back.
    security_opt:
      - no-new-privileges:true
    # No published port. The application reaches the database over the compose
    # network; nothing outside the host has any business connecting to it.
    volumes:
      # PostgreSQL 18 moved PGDATA to a version-scoped path
      # (/var/lib/postgresql/18/docker) and raised its declared VOLUME to
      # /var/lib/postgresql. Mounting the pre-18 /var/lib/postgresql/data here
      # leaves the real data directory outside this named volume, and the
      # entrypoint then classifies the stale mount as unused legacy data and
      # exits before initialising.
      - postgres-data:/var/lib/postgresql
      - superuser-credentials:/credentials/superuser:ro
    healthcheck:
      # Over TCP, the way every other service connects. On a first start the
      # image initialises the volume with a temporary server that listens on
      # its socket alone, so a check over the socket could pass before anything
      # on the network can connect.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U openbrf -d openbrf"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The schema owner: creates it, gives it the database, and sets its password,
  # as the superuser (docker/schema-owner.sql). Runs on every `up`, before the
  # migrate service, and changes nothing once the owner is in place but the
  # password. This and the database are the only running containers given the
  # superuser's password.
  schema-owner:
    <<: [*openbrf-image, *openbrf-hardening, *openbrf-one-shot]
    command: ["schema-owner"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production

      # The parts rather than a connection URL, for the reason given on the
      # migrate service.
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-openbrf}
      POSTGRES_USER: ${POSTGRES_USER:-openbrf}
      # Empty, the password the superuser-password service put on the volume
      # below.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}

      # The owner it creates, openbrf_owner unless OWNER_DB_USER names another,
      # and the runtime role's name, so that it can refuse the two being one.
      # The owner's password is OWNER_DB_PASSWORD, or one this service
      # generates onto the owner's volume when that is empty: it sets the
      # password on every `up`, so it can make one on any of them.
      OWNER_DB_USER: ${OWNER_DB_USER:-}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:-}
      RUNTIME_DB_ROLE: ${RUNTIME_DB_ROLE:-}
    volumes:
      - superuser-credentials:/credentials/superuser:ro
      - owner-credentials:/credentials/owner

  # The deploy steps: the field encryption key on a first boot, migrations, the
  # job queue schema and the application's own database role, all as the schema
  # owner. Runs on every `up`, does its work and exits; the application starts
  # only once it has succeeded. This is the only container that is given the
  # owner's password besides schema-owner, which sets it, and it reads it from
  # OWNER_DB_PASSWORD or from the owner's volume, which it mounts read-only.
  migrate:
    <<: [*openbrf-image, *openbrf-hardening, *openbrf-one-shot]
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
      schema-owner:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production

      # The parts rather than the connection URLs: a password is a URL
      # component, one holding :, /, @, ? or # has to be percent-encoded, and
      # interpolation here cannot encode anything. The entrypoint assembles the
      # URLs from these, encoding as it goes.
      #
      # The bundled database unless the env file names another server
      # (docs/deployment.md, "Several instances on one database server").
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-openbrf}
      OWNER_DB_USER: ${OWNER_DB_USER:-}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:-}

      # The application's own role, which this service creates and constrains,
      # from RUNTIME_DB_PASSWORD or from a password it generates onto the data
      # volume when neither of these two is set - or, with DATABASE_URL_RUNTIME
      # set alone, leaves to the operator who manages it. See the app service
      # below. The role's name and the pool size it is limited by are explained
      # there as well.
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:-}
      DATABASE_URL_RUNTIME: ${DATABASE_URL_RUNTIME:-}
      RUNTIME_DB_ROLE: ${RUNTIME_DB_ROLE:-}
      OPENBRF_DATABASE_POOL_SIZE: ${OPENBRF_DATABASE_POOL_SIZE:-}

      # Read to tell a first boot from a missing key; see the app service.
      OPENBRF_ENCRYPTION_KEY: ${OPENBRF_ENCRYPTION_KEY:-}
    volumes:
      # The field encryption key is generated here on a first boot, and the
      # runtime role's password on the first deploy that needs one.
      - instance-data:/data
      - owner-credentials:/credentials/owner:ro

  app:
    <<: [*openbrf-image, *openbrf-hardening]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000

      # The release line the image above is pulled at, repeated here, where
      # nothing reads it, for a platform that lists a stack's variables from
      # its services' environments and would not list one named only in an
      # image. Coolify is one. Empty here, because such a platform fills a
      # required variable in with its message, which no image is tagged with;
      # the image line above is what requires it.
      OPENBRF_VERSION: ${OPENBRF_VERSION:-}

      # The address members will type. Invitation and sign-in links are built
      # from it, and the session cookie is issued for it, so a wrong value here
      # produces links that go nowhere.
      APP_URL: ${APP_URL:?set APP_URL to the address this instance is reached at}

      # The reverse proxy in front, as the addresses it connects from. Only its
      # X-Forwarded-For is believed; empty, the header is not read and every
      # visitor behind the proxy shares its rate limits (docs/deployment.md,
      # "Behind a reverse proxy").
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}

      # The application connects as the runtime role, never as the schema
      # owner: a table owner can disable the triggers that keep the member
      # register and the audit log append-only. No owner credential is given to
      # this container, and its entrypoint refuses to start if one is.
      #
      # The parts rather than the connection URL, for the reason given on the
      # migrate service.
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-openbrf}

      # Three ways to give the application its own connection. Neither
      # variable is required here, because requiring either would make the
      # others impossible to use.
      #
      # Neither set is the ordinary path: the migrate service generates the
      # runtime role's password onto the data volume, creates the role and
      # reapplies its constraints on every deploy, and the entrypoint reads the
      # password from there. RUNTIME_DB_PASSWORD does the same with a password
      # the operator chose. DATABASE_URL_RUNTIME is for an operator who manages
      # that role themselves; the role is left alone and the URL used as
      # written, so its password has to be percent-encoded already. Either way
      # the application asks the database at start whether the role it
      # connected as is a constrained one, and refuses to serve if it is not.
      # The runtime role owns nothing, so its password may reach every service
      # of a platform that shares variables.
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:-}
      DATABASE_URL_RUNTIME: ${DATABASE_URL_RUNTIME:-}

      # For several instances on one database server; empty is the default.
      # The runtime role's name, openbrf_app unless set: a role belongs to the
      # whole server, so each instance there names its own. And the size of
      # the application's connection pool, ten unless set, out of the server's
      # max_connections (docs/deployment.md, "Several instances on one
      # database server"). The owner's name is here only so that the start can
      # refuse a runtime role that is the owner.
      OWNER_DB_USER: ${OWNER_DB_USER:-}
      RUNTIME_DB_ROLE: ${RUNTIME_DB_ROLE:-}
      OPENBRF_DATABASE_POOL_SIZE: ${OPENBRF_DATABASE_POOL_SIZE:-}

      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in the env file}
      # Empty: any public https host may present a connected app's metadata
      # document. Listed: only these (docs/deployment.md, "Connected apps").
      OPENBRF_OAUTH_CLIENT_METADATA_HOSTS: ${OPENBRF_OAUTH_CLIENT_METADATA_HOSTS:-}

      # The digest of a setup link minted for this instance, set by a host that
      # hands the link to the board. Left empty, an unclaimed instance prints a
      # setup link of its own to this container's log when it starts, and only
      # that link can create the first administrator (ADR 0023).
      OPENBRF_SETUP_TOKEN_DIGEST: ${OPENBRF_SETUP_TOKEN_DIGEST:-}

      # Left unset on purpose: the migrate service generates a key into
      # /data/keys on first boot and refuses to invent one afterwards. Set it
      # only when a hosting platform injects the key instead of mounting a
      # volume, and then keep the env file with the key's copies, out of the
      # backups (docs/backup-and-restore.md).
      OPENBRF_ENCRYPTION_KEY: ${OPENBRF_ENCRYPTION_KEY:-}

      OPENBRF_PLUGINS_ENABLED: ${OPENBRF_PLUGINS_ENABLED:-true}
      OPENBRF_CATALOG_URL: ${OPENBRF_CATALOG_URL:-}
      # Only for an index that requires a bearer token; the curated catalog is
      # public.
      OPENBRF_CATALOG_TOKEN: ${OPENBRF_CATALOG_TOKEN:-}
      OPENBRF_UNCURATED_PLUGINS_ENABLED: ${OPENBRF_UNCURATED_PLUGINS_ENABLED:-false}

      # Mail set where the instance runs (ADR 0024; docs/deployment.md, "Mail").
      # All empty by default, which leaves the mail to the SMTP server the board
      # enters in the setup wizard and the settings. OPENBRF_MAIL_DRIVER "smtp"
      # or "http-api" sets it here instead, for every message, and the settings
      # then show it and cannot change it.
      OPENBRF_MAIL_DRIVER: ${OPENBRF_MAIL_DRIVER:-}
      OPENBRF_MAIL_FROM_ADDRESS: ${OPENBRF_MAIL_FROM_ADDRESS:-}
      OPENBRF_MAIL_FROM_NAME: ${OPENBRF_MAIL_FROM_NAME:-}
      OPENBRF_MAIL_REPLY_TO: ${OPENBRF_MAIL_REPLY_TO:-}
      OPENBRF_SMTP_HOST: ${OPENBRF_SMTP_HOST:-}
      OPENBRF_SMTP_PORT: ${OPENBRF_SMTP_PORT:-}
      OPENBRF_SMTP_SECURE: ${OPENBRF_SMTP_SECURE:-}
      OPENBRF_SMTP_REQUIRE_TLS: ${OPENBRF_SMTP_REQUIRE_TLS:-}
      OPENBRF_SMTP_USER: ${OPENBRF_SMTP_USER:-}
      OPENBRF_SMTP_PASSWORD: ${OPENBRF_SMTP_PASSWORD:-}
      OPENBRF_MAIL_API_URL: ${OPENBRF_MAIL_API_URL:-}
      OPENBRF_MAIL_API_KEY: ${OPENBRF_MAIL_API_KEY:-}
      OPENBRF_MAIL_API_MESSAGE_ID_DOMAIN: ${OPENBRF_MAIL_API_MESSAGE_ID_DOMAIN:-}

      # Whether the SMTP server, the SMS gateway and the board's mailbox entered
      # in the settings may be on a private network, such as a relay on the
      # association's own LAN. Off by default (docs/deployment.md, "Servers the
      # board enters").
      OPENBRF_ALLOW_PRIVATE_HOSTS: ${OPENBRF_ALLOW_PRIVATE_HOSTS:-false}
    # No port on the host. A reverse proxy on the stack's network, as a
    # hosting platform's own is, reaches the application as app:3000 and needs
    # none, and a host port another service already holds would stop the
    # stack from starting. A proxy on the host itself adds
    # docker-compose.host-port.yml, which publishes it on loopback
    # (docs/deployment.md, "Behind a reverse proxy").
    expose:
      - "3000"
    volumes:
      # Uploads, the field encryption key, installed plugins and installed
      # themes. Back this up together with the database, without keys/: the key
      # is copied out once and kept apart from every backup, because a backup
      # that carried it would open every encrypted field and stored file in it
      # (docs/backup-and-restore.md).
      - instance-data:/data
    healthcheck:
      # The image's own health check, repeated so this file states it. No curl
      # in the image, so the check runs in the runtime that is already there.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      # Migrations and the role hardening have already run, in the migrate
      # service, by the time this container starts.
      start_period: 90s
    # The job queue drains on SIGTERM rather than losing in-flight work.
    stop_grace_period: 30s

volumes:
  # Named distinctly from the development volume in docker-compose.yml so the
  # two stacks can never share a data directory.
  postgres-data:
  instance-data:
  # The database passwords the deploy generates, each on a volume of its own
  # so that a service mounts only the one it needs, and the application
  # neither. Not backed up: the owner's is set again on every `up`, and a
  # restore into a new stack generates the superuser's anew
  # (docs/backup-and-restore.md).
  superuser-credentials:
  owner-credentials:
