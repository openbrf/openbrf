# Overlay on docker-compose.prod.yml for the end-to-end suite.
#
# The suite runs against the production image, not a dev server: an image that
# passes here is the image the pilot installs. This file changes only what a
# test needs and cannot get from outside the stack.
#
# One of those is the image itself. The production file runs the published
# image a release tag names; the suite runs the one built from this checkout,
# which is the image the next release will publish. So the build lives here,
# and its context is the repository root, because Compose resolves every
# relative path against the directory of the first file it is given. All three
# of the instance's services run that image, so each names the build: one that
# named only the tag would have Compose try to pull it.
# stack.env sets OPENBRF_VERSION only so the production file's required
# variable interpolates; the image named below is the one that runs.
#
# Its tag comes from the env file, openbrf:e2e for the suite and openbrf:shots
# for the screenshot walk, so neither build retags the other's image while it
# runs, and neither is a tag anything else on the machine uses.
#
#   OPENBRF_E2E_MAIL_TLS_DIR=$PWD/e2e/.mail-tls/openbrf-e2e \
#   docker compose -p openbrf-e2e \
#     -f docker-compose.prod.yml -f e2e/docker-compose.e2e.yml \
#     --env-file e2e/stack.env up -d
#
# The suite sets OPENBRF_E2E_MAIL_TLS_DIR itself and writes mailpit's
# certificate there before it starts the stack.
#
# The project name is always openbrf-e2e, so the suite can recreate its own
# volumes without ever touching a development or production stack.

x-e2e-image: &e2e-image
  build:
    context: .
  image: ${E2E_IMAGE:?set E2E_IMAGE in the env file}

services:
  schema-owner:
    <<: *e2e-image

  migrate:
    <<: *e2e-image

  db:
    # The database docker-compose.prod.yml runs, by the same digest, but pulled
    # from Amazon's copy of the Docker official images. Docker Hub limits
    # anonymous pulls per address, and the suite runs on CI runners whose
    # addresses everyone else's CI shares; an operator's own pull is the
    # production file's business and stays on Docker Hub. Dependabot moves
    # this digest with the production file's (.github/dependabot.yml), and
    # `pnpm lint:guards` fails when the two differ.
    image: public.ecr.aws/docker/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    ports:
      # Published so the suite can assert on the audit log directly. Reveals of
      # protected personal data have to reach that table, the table is
      # append-only and has no read endpoint, and a legal invariant is worth
      # checking against the database the deployed image actually wrote to.
      - "127.0.0.1:${E2E_DB_PORT:-5442}:5432"

  mailpit:
    # From the GitHub Container Registry, which mailpit publishes to alongside
    # Docker Hub with the same digest, for the reason the database above is
    # not pulled from Docker Hub either.
    image: ghcr.io/axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      # STARTTLS on 1025, and nothing accepted before it. The application
      # requires TLS of an SMTP server that is not on its own loopback, which
      # mailpit on the compose network is not, so the suite sends the way an
      # association's own server is sent to. The certificate is the suite's,
      # written before the stack starts (e2e/src/stack.ts, writeMailTls), into
      # a directory of the stack's own profile so a capture and a suite run do
      # not replace each other's key.
      MP_SMTP_TLS_CERT: /mail-tls/mailpit.crt
      MP_SMTP_TLS_KEY: /mail-tls/mailpit.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
      # Turns on the POP3 server, which is how the board mailbox spec proves the
      # inbound half against a real protocol rather than a stub. The application
      # collects from mailpit:1110 exactly as it would collect from an
      # association's own provider - the settings it is given are the ordinary
      # ones, so the path under test is the real one.
      #
      # The credentials are the suite's, like everything else in stack.env: this
      # stack listens on loopback only and its volumes are destroyed at the start
      # of every run.
      MP_POP3_AUTH: "styrelsen:brevladelosen"
    volumes:
      - ${OPENBRF_E2E_MAIL_TLS_DIR:?set by e2e/src/stack.ts}:/mail-tls:ro
    ports:
      # The HTTP API the suite reads messages from, and posts an inbound message
      # to. Its SMTP port stays inside the compose network, where the application
      # reaches it as mailpit:1025, and so does its POP3 port on 1110.
      - "127.0.0.1:${E2E_MAILPIT_PORT:-8125}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    <<: *e2e-image
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      # The one certificate the image does not already trust: mailpit's, so the
      # required STARTTLS verifies it as it verifies any server's.
      NODE_EXTRA_CA_CERTS: /mail-tls/mailpit.crt
    volumes:
      - ${OPENBRF_E2E_MAIL_TLS_DIR:?set by e2e/src/stack.ts}:/mail-tls:ro
