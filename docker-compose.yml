# Local development infrastructure.
# The app service is added once the API is deployable.
services:
  db:
    # A PostgreSQL data directory is not portable across major versions, so a
    # volume created by an earlier major refuses to start under this image.
    # Nothing here is precious -- recreate it with `docker compose down -v &&
    # docker compose up -d db`, then re-run the migrations.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openbrf
      POSTGRES_PASSWORD: openbrf
      POSTGRES_DB: openbrf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbrf -d openbrf"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
