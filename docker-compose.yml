# Local development infrastructure.
# The app service is added once the API is deployable.
services:
  db:
    # A PostgreSQL data directory is not portable across major versions, so a
    # volume created by an earlier major cannot be reused here. This is local
    # development infrastructure only and holds nothing precious: discard it
    # with `docker compose down -v && docker compose up -d db`, then re-run the
    # migrations. Never run that against an association's data.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openbrf
      POSTGRES_PASSWORD: openbrf
      POSTGRES_DB: openbrf
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 moved PGDATA to a version-scoped path
      # (/var/lib/postgresql/18/docker) and its declared VOLUME up to
      # /var/lib/postgresql. Mounting the pre-18 /var/lib/postgresql/data here
      # would leave the real data directory outside this named volume, on an
      # anonymous one, so the database would silently not survive a recreate.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbrf -d openbrf"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
