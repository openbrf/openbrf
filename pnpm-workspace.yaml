packages:
  - apps/*
  - packages/*
  - e2e

# Dependency build scripts must be approved explicitly (pnpm >= 10).
allowBuilds:
  "@prisma/engines": true
  "@swc/core": true
  esbuild: true
  prisma: true
  # 3.4.1 (field encryption) uses node-gyp-build, which links a shipped
  # prebuild rather than compiling (prebuilds exist for linux-x64, linux-arm64,
  # darwin-x64 and darwin-arm64). 5.1.0 (stored files) has no build script and
  # loads its prebuild at run time.
  sodium-native: true
  # Pulled in transitively by better-auth, whose default adapter supports
  # SQLite. This project uses the Prisma adapter against PostgreSQL and never
  # loads it, so the native binding must not be compiled.
  #
  # It rides along as an *optional peer* of better-auth and the Prisma CLI,
  # which pnpm resolves anyway; `ignoredOptionalDependencies` cannot drop it,
  # as that setting only covers `optionalDependencies`. The copy that lands is
  # inert -- the build script is refused here and no code path imports the
  # module -- but it is still a copy, so which version lands is decided under
  # `overrides` below rather than left to the peer range.
  better-sqlite3: false

# pdfjs-dist (the document reads) declares a native canvas binding as optional,
# for rendering pages to images. Open BRF only reads a PDF's text layer and never
# renders a page, so the binding is not installed: a native module the parser
# can load is attack surface the text read does not need.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"

# pnpm holds a freshly published version back for a cooling-off period before
# it will install it. Everything here is a version this repository asked for
# while it was still inside that window, and pnpm records the exemption itself
# on the install that took it -- the list is maintained by the tool, not by
# hand. Entries name an exact version, so an exemption never outlives the
# release it was granted for.
minimumReleaseAgeExclude:
  - "@playwright/test@1.63.0"
  - "@swc/core-darwin-arm64@1.16.2"
  - "@swc/core-darwin-x64@1.16.2"
  - "@swc/core-linux-arm-gnueabihf@1.16.2"
  - "@swc/core-linux-arm64-gnu@1.16.2"
  - "@swc/core-linux-arm64-musl@1.16.2"
  - "@swc/core-linux-ppc64-gnu@1.16.2"
  - "@swc/core-linux-s390x-gnu@1.16.2"
  - "@swc/core-linux-x64-gnu@1.16.2"
  - "@swc/core-linux-x64-musl@1.16.2"
  - "@swc/core-win32-arm64-msvc@1.16.2"
  - "@swc/core-win32-ia32-msvc@1.16.2"
  - "@swc/core-win32-x64-msvc@1.16.2"
  - "@swc/core@1.16.2"
  - playwright-core@1.63.0
  - playwright@1.63.0
  - adm-zip@0.6.1
  - "@better-auth/cimd@1.7.6"
  - "@better-auth/core@1.7.6"
  - "@better-auth/drizzle-adapter@1.7.6"
  - "@better-auth/kysely-adapter@1.7.6"
  - "@better-auth/mcp@1.7.6"
  - "@better-auth/memory-adapter@1.7.6"
  - "@better-auth/mongo-adapter@1.7.6"
  - "@better-auth/oauth-provider@1.7.6"
  - "@better-auth/passkey@1.7.6"
  - "@better-auth/prisma-adapter@1.7.6"
  - "@better-auth/telemetry@1.7.6"
  - "@oxlint-tsgolint/darwin-arm64@7.0.2003"
  - "@oxlint-tsgolint/darwin-x64@7.0.2003"
  - "@oxlint-tsgolint/linux-arm64@7.0.2003"
  - "@oxlint-tsgolint/linux-x64@7.0.2003"
  - "@oxlint-tsgolint/win32-arm64@7.0.2003"
  - "@oxlint-tsgolint/win32-x64@7.0.2003"
  - "@turbo/darwin-64@2.11.4"
  - "@turbo/darwin-arm64@2.11.4"
  - "@turbo/linux-64@2.11.4"
  - "@turbo/linux-arm64@2.11.4"
  - "@turbo/windows-64@2.11.4"
  - "@turbo/windows-arm64@2.11.4"
  - better-auth@1.7.6
  - oxlint-tsgolint@7.0.2003
  - turbo@2.11.4
  - vite@8.3.1
  - "@voidzero-dev/vite-plus-core@1.2.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.2.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.2.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.2.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.2.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.2.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.2.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.2.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.2.0"
  - vite-plus@1.2.0

# An optional peer whose declared range trails the version this repository
# runs. It is not loaded here, so the range is a statement about upstream's
# test matrix rather than about this install.
peerDependencyRules:
  allowedVersions:
    # The SQLite adapter's peer, held at 12 upstream. See the override below
    # for why 13 is what gets installed.
    "better-auth>better-sqlite3": "13"
  # Vite plugins declare a `vite` peer by Vite's own version (^8 and so on).
  # The `vite` they get is Vite+'s build of it, which carries Vite+'s version
  # number (see `catalog` below), so no range they declare can match it.
  allowAny:
    - vite

# Transitive dependency advisories we resolve ahead of the upstream package.
overrides:
  # GHSA-vwc7-r8mq-g2x9: extraction follows a symlink already present in the
  # destination, so an archive can overwrite a file outside it. Fixed in 0.6.1.
  # @module-federation/dts-plugin pins adm-zip at an exact 0.6.0 and extracts
  # with it only when a build downloads a remote's type archive. The web app
  # declares no remotes at build time, so no archive is downloaded here, but the
  # pin is what the plugin ships and only an override moves it.
  adm-zip: "^0.6.1"
  # better-sqlite3 12 reaches its prebuilt binary through prebuild-install,
  # which its author deprecated as unmaintained; 13 dropped the dependency and
  # is the only reason this pin exists. Nothing here loads better-sqlite3 and
  # its build script is refused above, so the choice is purely about what the
  # install prints. Bounded to 13 rather than left open: an override answers
  # for every copy in the tree, so a major nobody has looked at should not be
  # able to arrive through it.
  better-sqlite3: "^13.0.3"
  # GHSA: stack exhaustion when merging recursive object graphs. Reached only
  # through @prisma/config merging our own prisma.config.ts at CLI time, so the
  # practical exposure here is nil, but the fix is free if Prisma's config
  # loader works with v8.
  deepmerge-ts: ">=8.0.0"
  # @nestjs/platform-fastify pins fastify to an exact patch, which can trail
  # the version apps/api declares. Two copies then land in the tree, and a
  # plugin registered against one of them does not type-check against the
  # server built from the other: @fastify/static's `reply.sendFile` augments a
  # FastifyReply the application never sees. One copy, the declared one.
  # Not below 5.12.6: GHSA-389g-gv7q-r4x8 (a `propertyNames` header deny-list
  # in canonical case never matched the lowercased request headers) affects
  # 5.12.2 up to 5.12.5.
  fastify: "5.12.7"
  # GHSA-rgwj-5xj2-c3m3: the compressed MySQL protocol handler inflates a
  # packet with no output cap, so a hostile server can expand a small packet
  # into gigabytes of client memory. Fixed in 3.23.1. The Prisma CLI depends on
  # mysql2 at an exact 3.15.3 and better-auth resolves the same copy as an
  # optional peer; this project speaks PostgreSQL and never opens a MySQL
  # connection, so the handler is unreachable, but the pin is what the CLI
  # ships and only an override moves it.
  mysql2: "^3.23.1"
  # GHSA-2m5v-pch6-74hx, GHSA-4qv8-2p9j-2685, GHSA-4w7w-5xrc-9h26,
  # GHSA-55wc-3pg8-jfw6, GHSA-9fm3-97px-rjf6, GHSA-f72v-6w45-q472,
  # GHSA-qrxm-fqhp-jwvm and GHSA-xjj6-f33q-929c: undici's TLS options, HTTP
  # cache, decompression, EventSource, WebSocket and integrity checks, all fixed
  # in 7.30.1. @module-federation/dts-plugin pins undici at an exact 7.29.1 and
  # uses it only for the requests that fetch a remote's manifest and types,
  # which the web app, declaring no remotes at build time, never makes. Scoped
  # to that parent so the 8.x copy other packages resolve stays where it is.
  "@module-federation/dts-plugin>undici": "^7.30.1"
  # Every copy of Vite is the one Vite+ ships (see `catalog` below), so the
  # plugins the web app builds with run inside the Vite that `vp` runs.
  vite@*: "catalog:"
  # better-auth takes Vitest as an optional peer for its test helpers, which
  # nothing here imports. pnpm resolves it to the Vitest that Vite+ installs,
  # and records it on better-auth itself: `pnpm prune --prod` then keeps that
  # Vitest, and the Vite+ build of Vite under it, in the production image.
  # Without the peer, the prune leaves no toolchain behind (see Dockerfile).
  better-auth>vitest: "-"

# Dependencies a published package leaves to its consumer, stated here instead.
packageExtensions:
  # sodium-plus, which ciphersweet-js encrypts fields through (ADR 0002), takes
  # sodium-native as a peer in the 3.x range, and a peer resolves to what the
  # packages above it provide. The API depends on sodium-native 5.1.0 for
  # stored files (ADR 0015), so without this the field encryption would load a
  # major its peer range excludes. As a dependency of ciphersweet-js itself,
  # 3.4.1 is the copy sodium-plus resolves, and the process loads the two
  # builds side by side until ciphersweet-js is replaced.
  ciphersweet-js@2.0.6:
    dependencies:
      sodium-native: 3.4.1

# Vite+ (ADR 0025) bundles Vite, Vitest and Oxlint, and moves them together:
# one exact version, used by every package that builds, tests or lints. `vite`
# names Vite+'s own build of Vite, so that the Vite a plugin imports is the one
# `vp build` runs.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.4.0
