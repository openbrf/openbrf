name: PR title

# A workflow of its own, because a title is edited without a push. The default
# pull_request activity types are opened, synchronize and reopened, so in ci.yml
# a renamed pull request kept the verdict on its old title: a valid title
# renamed to an invalid one stayed green and landed as the squash commit's
# message, and a contributor who fixed a red one had to push an empty commit to
# clear it. Here `edited` re-runs this check and nothing else - the build, the
# integration tests and the two image builds have no reason to repeat because
# a title changed.
#
# `edited` also fires when the description or the base branch is edited. A
# description edit costs one install and a commitlint run, which is cheaper
# than telling the two apart.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# One verdict per pull request: a run started for a title that has since been
# edited again, or for a commit that has since been pushed over, says nothing
# about what will merge. Keyed on this workflow alone, so it never cancels a CI
# run.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege rather than whatever the repository default happens to be.
# Checkout and dependency caching need nothing beyond reading the contents.
permissions:
  contents: read

jobs:
  pr-title:
    # This job name is what the main ruleset requires. Renaming it detaches
    # the required check, and every pull request then waits on a status that is
    # never reported - change the ruleset in the same breath or not at all.
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token has no reason to sit in the
          # runner's git config where later steps and scripts can read it.
          persist-credentials: false
          # The whole history, because the last step reads the commits between
          # the base and the head that are not on the default branch, and the
          # base, the head and the default branch all have to be in the clone.
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A pull request squashed onto main lands with its title as the commit
      # message, so the title must follow Conventional Commits. The title
      # reaches the shell through the environment and never through the
      # script's text, where a title holding a quote or `$(...)` would run.
      - name: Lint PR title with commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf "%s\n" "$PR_TITLE" | pnpm exec commitlint

      # A pull request rebased onto main lands as its commits instead, each
      # one a message on main that changelog tooling reads, and nothing here
      # can know which of the two a pull request will be merged by. So every
      # commit is linted as well, in this job rather than one of its own,
      # because this is the one the ruleset requires.
      #
      # Every commit the pull request brings that is not on the default branch
      # already. Against main that is every commit between the base and the
      # head. Against a long-lived branch such as an integration branch, a pull
      # request that merges main in also brings main's own commits, which were
      # linted by the pull requests that landed them and which no branch can
      # rewrite: a squash commit's header gains " (#123)" on landing, so one
      # that fitted as a title can be too long here.
      #
      # The same suffix is why a trailing " (#123)" is taken off a header
      # before it is linted. A pull request from an integration branch into
      # main brings the squash commits of the pull requests that landed on
      # that branch, each one linted as a title without the suffix GitHub then
      # added, and no branch can rewrite those either. Everything else in the
      # header is still linted.
      - name: Lint every commit with commitlint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # The list is read before the loop, so a ref missing from the clone
        # fails the step instead of leaving nothing to lint.
        run: |
          commits=$(git rev-list --reverse "$HEAD_SHA" "^$BASE_SHA" "^refs/remotes/origin/$DEFAULT_BRANCH")
          status=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            echo "commit $sha"
            git log -1 --format=%B "$sha" \
              | sed -E '1s/ \(#[0-9]+\)$//' \
              | pnpm exec commitlint --verbose || status=1
          done <<< "$commits"
          exit "$status"
