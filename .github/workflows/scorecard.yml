name: Scorecard

on:
  # Only the default branch is analysed, so a branch protection change is the
  # one repository setting that can move the Branch-Protection score.
  branch_protection_rule:
  # Keeps the Maintained check fed, and re-scores the repository even in a week
  # with no pushes.
  schedule:
    - cron: "25 0 * * 0"
  push:
    branches: [main]

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

# Least privilege rather than whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest

    # Results can only be published from the default branch, and a run that
    # cannot publish is a run that cannot update the badge.
    if: github.event.repository.default_branch == github.ref_name

    # Job-level permissions replace the read-only default above rather than
    # extend it, so the checkout's contents: read has to be repeated here.
    permissions:
      contents: read
      # Upload the findings to the code scanning dashboard.
      security-events: write
      # Sign the results so the OpenSSF API accepts them; this is what makes
      # the README badge resolve.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token has no reason to sit in the
          # runner's git config where later steps and scripts can read it.
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to the OpenSSF REST API, which is what the badge reads.
          # Public repositories only; on a private one this is forced to false.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
