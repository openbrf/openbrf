name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Least privilege rather than whatever the repository default happens to be.
# The signature store is the only thing this workflow writes, so the writes it
# needs are declared on the job that does the writing and nowhere else.
permissions:
  contents: read

jobs:
  cla:
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest

    # Job-level permissions replace the read-only default above rather than
    # extend it, so every permission the action needs has to be listed here.
    permissions:
      # Commit the signature file to the cla-signatures branch.
      contents: write
      # Post the signing comment and read the pull request.
      pull-requests: write
      # Report the CLA result as a commit status.
      statuses: write
      # Re-run the pull request's checks once the CLA is signed.
      actions: write

    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/openbrf/openbrf/blob/main/CLA.md
          branch: cla-signatures
          allowlist: neeo,dependabot[bot],renovate[bot]
