name: Mirror CI images

# CI pulls PostgreSQL, the Dockerfile's Node.js base image and Semgrep from
# copies in ghcr.io/openbrf/ci-mirror rather than from Docker Hub or ECR
# Public, whose anonymous quotas the runners' shared addresses use up
# (scripts/ci-images.mjs says why, and how a copy is named). This workflow
# makes those copies: the image a pin names, every platform of it, under the
# same digest.
#
# The pins stay in docker-compose.prod.yml, the Dockerfile and
# docker/semgrep/Dockerfile, where Dependabot keeps them, and a copy is made
# from the pin, so a bump needs nothing done by hand. CI waits a while for a
# copy that is not there yet, which covers the minute between a push and the
# copy that push starts.
#
# It also clears out what ci-images-pr.yml leaves behind, the copies under
# pr-<number> tags, with scripts/prune-ci-mirror.mjs, which says what it keeps.

on:
  # A push that changes a pin, to any branch of this repository: a bump of
  # Dependabot's, or a maintainer's. A fork's push runs nothing here; its pull
  # request starts ci-images-pr.yml, which copies the pins it proposes.
  push:
    paths:
      - Dockerfile
      - docker-compose.prod.yml
      - docker/semgrep/Dockerfile
      - scripts/ci-images.mjs
      - scripts/prune-ci-mirror.mjs
      - scripts/check-image-pins.mjs
      - .github/workflows/ci-images.yml
  # Daily as well, so that a copy someone deleted from the registry comes back
  # before a run misses it.
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: false

# Least privilege rather than whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  mirror:
    name: Mirror CI images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Job-level permissions replace the read-only default above rather than
    # extend it, so the checkout's contents: read has to be repeated here.
    # A run Dependabot's push starts is given a read-only token unless the
    # workflow asks for more, which this one does: the copy for a bump has to
    # exist before the bump's own CI can pass.
    permissions:
      contents: read
      packages: write

    env:
      OPENBRF_IMAGE_MIRROR: ghcr.io/openbrf/ci-mirror

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes to git, so the token has no reason to sit in
          # the runner's git config where later steps can read it.
          persist-credentials: false

      # For scripts/ci-images.mjs, which needs nothing installed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # skopeo copies registry to registry, every platform and the index
      # unchanged, without a Docker daemon in between. It is on the runner
      # image. The sources need no login; the copy is checked against the
      # digest whichever of them hands it over.
      - name: Log in to the GitHub Container Registry
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin

      - name: Copy the images the mirror lacks
        run: node scripts/ci-images.mjs mirror

      # The registry deletes versions, not tags, so a copy that only a pr-*
      # tag holds and a pin names is tagged first, on every branch: the pin
      # may be a Dependabot bump that adopts the digest a fork's pull request
      # copied. Deleting copies of closed pull requests uses the pins of the
      # default branch, the ones CI needs, so only it does that. Deleting a
      # package version takes the Admin role for this repository in the
      # package's settings, which packages: write does not give.
      - name: Prune the copies of pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            node scripts/prune-ci-mirror.mjs --delete
          else
            node scripts/prune-ci-mirror.mjs
          fi
