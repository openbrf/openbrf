name: Release

# Publishes @openbrf/tokens, @openbrf/theme-tools and @openbrf/plugin-sdk to
# npm, with provenance.
#
# A package's version changes only in its package.json, so a push to main that
# touches one of the three is what can carry a new version. The job waits in
# the `npm` environment for a required reviewer before anything runs, then
# builds and tests the three packages and hands them to
# scripts/publish-packages.mjs, which skips every version the registry already
# has. A push that changes a manifest without changing its version therefore
# asks for approval all the same, and the approved run publishes nothing. A run
# that stopped halfway is finished by running it again, from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - packages/tokens/package.json
      - packages/theme-tools/package.json
      - packages/plugin-sdk/package.json
  workflow_dispatch:

# One publish at a time, never cancelled: a run stopped between two packages
# leaves the registry with some of a release and not the rest.
concurrency:
  group: release-npm
  cancel-in-progress: false

# Least privilege, raised for the one job that publishes.
permissions:
  contents: read

jobs:
  publish:
    name: Publish the packages to npm
    # A dispatch can name any branch; only main is published from.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The approval gate, and the only place the publish token lives.
    environment: npm
    permissions:
      contents: read
      # The identity npm's provenance statement is signed from, and the one a
      # trusted publisher is matched against.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token has no reason to sit in the
          # runner's git config where later steps and scripts can read it.
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No dependency cache: what is published is built from a clean install,
      # never from a cache another run wrote.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # In dependency order: theme-tools builds against the tokens.
      - name: Build the three packages
        run: pnpm --filter @openbrf/tokens --filter @openbrf/theme-tools --filter @openbrf/plugin-sdk run build

      - name: Test the three packages
        run: pnpm --filter @openbrf/tokens --filter @openbrf/theme-tools --filter @openbrf/plugin-sdk run test

      # The token is used for as long as the environment holds one. Once each
      # package has a trusted publisher on npmjs.com and the secret is deleted,
      # npm authenticates this same step with the job's OIDC identity instead.
      - name: Publish
        run: node scripts/publish-packages.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
