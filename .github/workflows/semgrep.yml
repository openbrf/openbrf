name: Semgrep

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege rather than whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  # Scanning and uploading are two jobs so that the write token is not in the
  # room while third-party code runs. The scan executes rulesets fetched from
  # the Semgrep registry at run time in a public repository, and needs nothing
  # but read access; security-events: write lives in the upload job alone,
  # which runs no registry code and only hands the SARIF to code scanning.
  scan:
    name: Semgrep scan
    runs-on: ubuntu-latest

    # Job-level permissions replace the read-only default above rather than
    # extend it, so the checkout's contents: read has to be repeated here.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token has no reason to sit in the
          # runner's git config where later steps and scripts can read it.
          persist-credentials: false

      # --strict fails the job on a file semgrep could not parse, so a scan
      # that quietly skipped code is a red build rather than a green one. The
      # test files are excluded because semgrep's TypeScript parser rejects
      # `importOriginal<typeof import("...")>()`, the vitest idiom this suite
      # uses; without the exclusion --strict fails on every run.
      #
      # Through the image rather than pip: an unpinned `pip install` would cost
      # the Scorecard Pinned-Dependencies check, and the image refuses to scan
      # unless the code is mounted at /src. The rulesets are fetched from the
      # Semgrep registry at run time, so they are not pinned the way the image
      # is - the registry decides which rules a given run applies.
      #
      # A finding that does not apply is suppressed with a `// nosemgrep:` line
      # immediately above the code, naming the rule and saying why it does not
      # hold. Name it exactly as the scan reports it, which for a registry rule
      # repeats the last segment - for instance
      # javascript.express.security.audit.express-res-sendfile.express-res-sendfile
      # and not that id with the repeat dropped. A shortened id fails silently:
      # the rule still matches, the job still fails, and nothing in the output
      # says the suppression went unrecognised.
      #
      # Findings go to the log as well as into the file: --text writes them to
      # stdout and --sarif-output keeps the copy the upload job needs. Without
      # the text output a red check reports a count and nothing else, and on a
      # pull request from a fork there is no other channel at all - that token
      # cannot write code scanning results, so the log is the only place a
      # finding can be read.
      - name: Run Semgrep
        run: |
          # Pinned in docker/semgrep/Dockerfile, where Dependabot keeps the
          # digest current. Only the image on its FROM line is read.
          SEMGREP_IMAGE=$(sed -n 's/^FROM //p' docker/semgrep/Dockerfile)
          if [ -z "$SEMGREP_IMAGE" ]; then
            echo "docker/semgrep/Dockerfile names no image." >&2
            exit 1
          fi
          # Pulled through Google's mirror of Docker Hub, which does not limit
          # anonymous pulls per address as Docker Hub does on runners whose
          # addresses everyone else's CI shares. The pin itself stays on Docker
          # Hub, where Dependabot reads the tags; the digest is the one Docker
          # Hub serves under the tag, and the mirror serves the same one. A
          # digest the mirror has not cached yet (a fresh Dependabot bump) falls
          # back to Docker Hub rather than failing the scan. Only that error does:
          # Docker reports a digest the mirror does not have as "manifest
          # unknown", "manifest for ... not found", or, with the containerd image
          # store, "failed to resolve reference ...: not found". A bare "not
          # found" is not enough, as "command not found" has it too. Any other
          # failure (an outage, a timeout, a refused connection) fails the
          # step, so that a lasting mirror outage is a red check someone reads
          # and not every run quietly pulling from Docker Hub and spending its
          # anonymous allowance.
          DOCKER_HUB_IMAGE="$SEMGREP_IMAGE"
          MIRROR_IMAGE="mirror.gcr.io/${DOCKER_HUB_IMAGE}"
          if PULL_OUTPUT=$(docker pull "$MIRROR_IMAGE" 2>&1); then
            echo "$PULL_OUTPUT"
            SEMGREP_IMAGE="$MIRROR_IMAGE"
          elif echo "$PULL_OUTPUT" | grep -qiE 'manifest unknown|manifest for .* not found|failed to resolve reference .*: not found'; then
            echo "$PULL_OUTPUT" >&2
            echo "::warning::mirror.gcr.io has not cached ${DOCKER_HUB_IMAGE}; pulling from Docker Hub."
            docker pull "$DOCKER_HUB_IMAGE"
            SEMGREP_IMAGE="$DOCKER_HUB_IMAGE"
          else
            echo "$PULL_OUTPUT" >&2
            echo "::error::mirror.gcr.io failed for a reason other than a missing digest; not falling back to Docker Hub."
            exit 1
          fi
          docker run --rm -v "$PWD:/src" "$SEMGREP_IMAGE" \
            semgrep scan \
            --config=p/typescript \
            --config=p/react \
            --config=p/nodejs \
            --config=p/github-actions \
            --metrics=off \
            --text \
            --sarif-output=semgrep.sarif \
            --error \
            --strict \
            --exclude='*.test.ts' \
            --exclude='*.test.tsx' \
            --exclude='*.spec.ts' \
            --exclude='*.spec.tsx'

      # Code scanning opens an alert for a result that carries an inSource
      # suppression instead of reading it as suppressed, so a `// nosemgrep:`
      # line produces a green scan and an open alert for the same finding -
      # a dashboard entry nobody can action and the scan already answered.
      # The SARIF keeps those results; the dashboard should not. Dropping them
      # here rather than in the upload job leaves the artifact and the
      # dashboard showing one set rather than two.
      #
      # A run that wrote no SARIF at all is a broken scan rather than a clean
      # one, and says so here, at the first step that reads the file.
      - name: Drop suppressed findings from the SARIF
        id: filter_sarif
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ ! -f semgrep.sarif ]; then
            echo "The scan wrote no SARIF, so it did not run to completion." >&2
            exit 1
          fi
          before=$(jq '[.runs[] | (.results // [])[]] | length' semgrep.sarif)
          jq '.runs[] |= (.results = ((.results // [])
                | map(select(((.suppressions // []) | length) == 0))))' \
            semgrep.sarif > semgrep.filtered.sarif
          after=$(jq '[.runs[] | (.results // [])[]] | length' semgrep.filtered.sarif)
          mv semgrep.filtered.sarif semgrep.sarif
          echo "Suppressed findings dropped from the SARIF: $((before - after))"

      # A finding fails the scan step and the SARIF still has to reach the
      # upload job, so this one runs regardless of that exit status. It does
      # not run regardless of the step above it: a jq or mv failure there
      # leaves semgrep.sarif holding the suppressed results the filter exists
      # to remove, and !cancelled() alone would carry them through this step
      # and the upload job to the dashboard. Gating on that step's outcome
      # fails the run closed instead - no artifact, so nothing to upload.
      - name: Upload SARIF artifact
        if: ${{ !cancelled() && steps.filter_sarif.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: error
          retention-days: 1

  upload:
    name: Upload to code scanning
    runs-on: ubuntu-latest
    needs: scan

    # A finding fails the scan job, so this one has to run regardless to get it
    # onto the dashboard; `needs` on its own would skip it. Fork pull requests
    # skip it and rely on the failing scan alone, since their token cannot
    # write code scanning results.
    if: ${{ !cancelled() && github.event_name == 'push' }}

    permissions:
      contents: read
      # The only place this is held, and only on push.
      security-events: write

    steps:
      # Checked out so that code scanning resolves the ref and commit from the
      # repository rather than from the environment alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download SARIF artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: semgrep-sarif

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep
