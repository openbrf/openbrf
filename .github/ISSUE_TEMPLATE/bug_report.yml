name: Bug report
description: Something is broken. Swedish is fine here if you prefer / du kan skriva på svenska.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.3.0 / commit sha
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Self-hosted or hosted? Browser/OS? Docker Compose setup details if relevant.
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This is not a security vulnerability (those go through SECURITY.md, never public issues)
          required: true
